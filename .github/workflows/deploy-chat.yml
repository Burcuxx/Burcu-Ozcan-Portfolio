name: Deploy chat Worker

# Deploys worker/ (the AI chat proxy) to Cloudflare Workers.
# Secrets live in GitHub (Settings -> Secrets and variables -> Actions), never in code:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY
# ANTHROPIC_API_KEY is uploaded as an encrypted Worker secret on every deploy.

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-chat.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Skip quietly until the secrets have been added in the repository settings.
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.ANTHROPIC_API_KEY != '' }}
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Secrets missing
        if: env.HAS_SECRETS != 'true'
        working-directory: .
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY as repository secrets to deploy the chat Worker."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        if: env.HAS_SECRETS == 'true'
      - run: npx tsc --noEmit
        if: env.HAS_SECRETS == 'true'
      - name: Deploy
        if: env.HAS_SECRETS == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.167.0"
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
